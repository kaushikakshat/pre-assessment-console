# Deliberately weak demo target: no security headers, insecure cookie, leaky banners, readable /.env
server {
  listen 80;
  server_tokens on;
  add_header Set-Cookie "sessionid=abc123; Path=/" always;
  add_header X-Powered-By "PHP/7.4.3" always;
  location / { root /usr/share/nginx/html; index index.html; }
  location = /.env { root /usr/share/nginx/html; default_type text/plain; }
}
