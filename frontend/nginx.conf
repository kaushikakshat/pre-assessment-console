server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append: a client-supplied value must not reach the throttle
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;  # the server-level headers above already apply; avoid duplicates
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }

  location / {
    try_files $uri /index.html;
  }
}
