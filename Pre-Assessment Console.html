<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pre-Assessment Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: prototype bar on top, app shell = sidebar + workspace, optional annotation rail on the right. */
:root {
  --surface-0: #f4f5f6; --surface-1: #ffffff; --surface-2: #eceef0; --border: #d3d8dc; --border-strong: #7d8891;
  --ink: #13181c; --ink-muted: #4d5961; --ink-disabled: #8a949b;
  --primary: #0c5a6a; --primary-hover: #08485a; --on-primary: #ffffff; --primary-subtle: #e2f0f2; --focus: #0c5a6a;
  --sev-critical: #8c1232; --sev-critical-bg: #fae4e9; --sev-high: #a13a05; --sev-high-bg: #fcebdd;
  --sev-medium: #735400; --sev-medium-bg: #faf0cd; --sev-low: #1c5687; --sev-low-bg: #e1edf8; --sev-info: #4d5961; --sev-info-bg: #eceef0;
  --ok: #1d6636; --ok-bg: #e1f1e6; --warn: #7a4d00; --warn-bg: #fbefd6; --danger: #a31d1b; --danger-bg: #fbe4e2; --danger-hover: #861412; --on-danger: #ffffff;
  --neutral: #4d5961; --neutral-bg: #eceef0; --scrim: rgba(10, 14, 16, 0.48);
  --proto-bg: #1b2125; --proto-ink: #e7ebed; --proto-muted: #a1abb2; --proto-accent: #f2c25a; --proto-line: #30383d;
  --note: #6a3fb0; --note-bg: #f1eafb;
  --shadow-raised: 0 1px 2px rgba(16, 24, 28, 0.06); --shadow-overlay: 0 12px 32px rgba(16, 24, 28, 0.18);
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 3px; --r-md: 6px; --r-lg: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface-0: #0e1113; --surface-1: #171b1e; --surface-2: #20262a; --border: #30383d; --border-strong: #6b767e;
  --ink: #e7ebed; --ink-muted: #a1abb2; --ink-disabled: #626c73;
  --primary: #5fc3d2; --primary-hover: #86d4e0; --on-primary: #0a1b1f; --primary-subtle: #12343a; --focus: #8fdde9;
  --sev-critical: #ff9cb1; --sev-critical-bg: #3d1420; --sev-high: #ffa86f; --sev-high-bg: #3b2110;
  --sev-medium: #f0c954; --sev-medium-bg: #33290a; --sev-low: #90c4f0; --sev-low-bg: #13293c; --sev-info: #a1abb2; --sev-info-bg: #252b2f;
  --ok: #7fd59b; --ok-bg: #12301d; --warn: #f2c25a; --warn-bg: #352708; --danger: #ff9089; --danger-bg: #3b1513; --danger-hover: #ffb0aa; --on-danger: #2a0807;
  --neutral: #a1abb2; --neutral-bg: #252b2f; --scrim: rgba(0, 0, 0, 0.64);
  --proto-bg: #050708; --proto-line: #20262a; --note: #c9a8ff; --note-bg: #2a1f3d;
  --shadow-raised: none; --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface-0: #0e1113; --surface-1: #171b1e; --surface-2: #20262a; --border: #30383d; --border-strong: #6b767e;
  --ink: #e7ebed; --ink-muted: #a1abb2; --ink-disabled: #626c73;
  --primary: #5fc3d2; --primary-hover: #86d4e0; --on-primary: #0a1b1f; --primary-subtle: #12343a; --focus: #8fdde9;
  --sev-critical: #ff9cb1; --sev-critical-bg: #3d1420; --sev-high: #ffa86f; --sev-high-bg: #3b2110;
  --sev-medium: #f0c954; --sev-medium-bg: #33290a; --sev-low: #90c4f0; --sev-low-bg: #13293c; --sev-info: #a1abb2; --sev-info-bg: #252b2f;
  --ok: #7fd59b; --ok-bg: #12301d; --warn: #f2c25a; --warn-bg: #352708; --danger: #ff9089; --danger-bg: #3b1513; --danger-hover: #ffb0aa; --on-danger: #2a0807;
  --neutral: #a1abb2; --neutral-bg: #252b2f; --scrim: rgba(0, 0, 0, 0.64);
  --proto-bg: #050708; --proto-line: #20262a; --note: #c9a8ff; --note-bg: #2a1f3d;
  --shadow-raised: none; --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.5); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--surface-0); color: var(--ink); font: 400 14px/20px var(--font-sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--proto-bg); }
#root { min-height: 100%; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.muted { color: var(--ink-muted); }
.sm { font-size: 13px; line-height: 18px; }
.xs { font-size: 12px; line-height: 16px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; left: 0; top: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 16px; }
.grow { flex: 1; min-width: 0; }
.spacer { margin-left: auto; }

/* Prototype bar */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--proto-bg); color: var(--proto-ink); display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; height: 39px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; line-height: 16px; border-bottom: 1px solid var(--proto-line); }
.proto b { color: var(--proto-accent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
.proto label { display: inline-flex; align-items: center; gap: 6px; color: var(--proto-muted); }
.proto select, .proto button { background: #2a3237; color: #e7ebed; border: 1px solid #4a555c; border-radius: 4px; height: 26px; padding: 0 8px; font-size: 12px; cursor: pointer; }
.proto button[aria-pressed="true"] { background: #f2c25a; color: #1b1405; border-color: #f2c25a; }
.proto .sep { width: 1px; height: 18px; background: #3a444a; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 39px); }
.shell.notes-on { grid-template-columns: 232px minmax(0, 1fr) 320px; }
.side { background: var(--surface-1); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 39px; height: calc(100vh - 39px); overflow-y: auto; }
.brand { padding: 4px 10px 16px; font-weight: 600; font-size: 15px; line-height: 20px; }
.brand span { display: block; font-weight: 400; color: var(--ink-muted); font-size: 12px; }
.navsec { font: 500 11px/16px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); padding: 14px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: var(--r-md); color: var(--ink-muted); font-weight: 500; font-size: 13px; cursor: pointer; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav[aria-current="page"] { background: var(--primary-subtle); color: var(--primary); }
.nav .cnt { margin-left: auto; font-size: 12px; background: var(--surface-2); color: var(--ink); border-radius: var(--r-sm); padding: 0 6px; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-muted); }

.work { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; background: var(--surface-1); border-bottom: 1px solid var(--border); position: sticky; top: 39px; z-index: 20; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; font-size: 13px; }
.crumbs .cur { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-md); border: 1px solid transparent; background: none; color: var(--ink-muted); cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.dotbadge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: var(--on-danger); font-size: 10px; line-height: 16px; text-align: center; padding: 0 4px; font-weight: 600; }
.who { text-align: right; font-size: 13px; line-height: 16px; }
.who small { display: block; color: var(--ink-muted); font-size: 12px; }
.page { padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; width: 100%; }
.pagehead { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.pagehead h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.pagehead .sub { color: var(--ink-muted); font-size: 13px; margin-top: 2px; }
.pagehead .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
h2.sec { font-size: 16px; line-height: 24px; font-weight: 600; }
h3.sub { font-size: 14px; line-height: 20px; font-weight: 600; }

/* Primitives */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid transparent; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--surface-1); color: var(--ink); border-color: var(--border-strong); }
.btn.secondary:hover { background: var(--surface-2); }
.btn.quiet { background: transparent; color: var(--primary); }
.btn.quiet:hover { background: var(--primary-subtle); }
.btn.danger { background: var(--danger); color: var(--on-danger); }
.btn.danger:hover { background: var(--danger-hover); }
.btn.danger-outline { background: var(--surface-1); color: var(--danger); border-color: var(--danger); }
.btn:disabled { background: var(--surface-2); color: var(--ink-disabled); border-color: var(--border); cursor: not-allowed; }

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-raised); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-h h2 { font-size: 15px; line-height: 22px; font-weight: 600; }
.card-b { padding: 20px; }
.card-b.tight { padding: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.stat:hover { border-color: var(--border-strong); }
.stat .l { font: 500 12px/16px var(--font-sans); letter-spacing: 0.02em; color: var(--ink-muted); }
.stat .v { font: 600 30px/36px var(--font-sans); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--r-sm); font: 500 12px/16px var(--font-sans); letter-spacing: 0.02em; white-space: nowrap; }
.t-ok { color: var(--ok); background: var(--ok-bg); } .t-warn { color: var(--warn); background: var(--warn-bg); } .t-danger { color: var(--danger); background: var(--danger-bg); }
.t-neutral { color: var(--neutral); background: var(--neutral-bg); } .t-info { color: var(--primary); background: var(--primary-subtle); }
.s-critical { color: var(--sev-critical); background: var(--sev-critical-bg); } .s-high { color: var(--sev-high); background: var(--sev-high-bg); }
.s-medium { color: var(--sev-medium); background: var(--sev-medium-bg); } .s-low { color: var(--sev-low); background: var(--sev-low-bg); } .s-info { color: var(--sev-info); background: var(--sev-info-bg); }
.conf { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); font: 500 12px/16px var(--font-sans); background: var(--surface-1); white-space: nowrap; }
.chip { display: inline-block; font: 400 12px/18px var(--font-mono); padding: 0 6px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); }
.spin { animation: spin 1.2s linear infinite; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-lg); }
.banner > svg { margin-top: 2px; flex: none; }
.banner .bt { color: var(--ink); min-width: 0; flex: 1; }
.banner .bt strong { display: block; font-weight: 600; }
.banner .bact { flex: none; }

/* Tables */
.tw { overflow-x: auto; position: relative; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
table.t th { text-align: left; font: 500 12px/16px var(--font-sans); letter-spacing: 0.02em; color: var(--ink-muted); background: var(--surface-2); padding: 10px 12px; white-space: nowrap; }
table.t td { padding: 12px; border-top: 1px solid var(--border); vertical-align: middle; }
table.t tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--surface-2); }
table.t tr.sel td { background: var(--primary-subtle); }
table.t .ttl { font-weight: 500; }
table.t td.mono:not(.xs) { white-space: nowrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; font: inherit; text-align: left; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }

/* Forms */
.form { display: flex; flex-direction: column; gap: 18px; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f > label, .f > .lbl { font: 500 13px/18px var(--font-sans); }
.req { color: var(--danger); }
.in { height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface-1); color: var(--ink); width: 100%; font-size: 14px; }
textarea.in { height: auto; min-height: 64px; padding: 8px 12px; resize: vertical; line-height: 20px; }
.in.mono { font-family: var(--font-mono); font-size: 13px; }
.in[aria-invalid="true"] { border: 2px solid var(--danger); }
.in:disabled, .in[readonly] { background: var(--surface-2); color: var(--ink-muted); }
.hint { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.err { display: flex; gap: 4px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--danger); font-weight: 500; }
.err svg { margin-top: 2px; flex: none; }
.f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: var(--surface-1); padding: 0 14px; height: 32px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink-muted); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* Stepper */
.steps { display: flex; gap: 0; list-style: none; margin: 0; padding: 0; counter-reset: s; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-muted); padding-right: 16px; }
.steps li + li::before { content: ""; width: 32px; height: 1px; background: var(--border-strong); margin-right: 8px; }
.steps .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-size: 12px; }
.steps li[data-s="cur"] { color: var(--ink); } .steps li[data-s="cur"] .n { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.steps li[data-s="done"] .n { border-color: var(--ok); color: var(--ok); }

/* Profile cards */
.profiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.prof { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--surface-1); cursor: pointer; text-align: left; }
.prof input { position: absolute; opacity: 0; pointer-events: none; }
.prof[data-sel="true"] { border: 2px solid var(--primary); padding: 15px; background: var(--primary-subtle); }
.prof[data-dis="true"] { cursor: not-allowed; background: var(--surface-2); border-color: var(--border); }
.prof:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; }
.prof[data-sel="true"] .radio { border-color: var(--primary); }
.prof[data-sel="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.prof .nm { font-weight: 600; font-size: 16px; line-height: 24px; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.meta b { color: var(--ink); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.prof[data-sel="true"] .chip { background: var(--surface-1); }

.modlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.modopt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-1); cursor: pointer; }
.modopt[data-on="true"] { border-color: var(--primary); background: var(--primary-subtle); }
.modopt[data-dis="true"] { cursor: not-allowed; background: var(--surface-2); }
.modopt input { margin-top: 2px; accent-color: var(--primary); }

/* Validation */
.val { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-1); overflow: hidden; }
.val-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 600; flex-wrap: wrap; }
.val-h .tg { margin-left: auto; font: 400 12px/18px var(--font-mono); color: var(--ink); }
.val ul { list-style: none; margin: 0; padding: 4px 16px 8px; }
.val li { display: grid; grid-template-columns: 16px minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 18px; }
.val li:last-child { border-bottom: 0; }
.val li svg { margin-top: 2px; }
.val-f { padding: 10px 16px 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--ink-muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Module progress */
.mods { list-style: none; margin: 0; padding: 0; }
.mods li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--border); }
.mods li:first-child { border-top: 0; }
.mods li[data-st="running"] { background: var(--primary-subtle); }
.mods .mn { font-weight: 500; }
.mods .md { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.mods .ms { font: 500 12px/16px var(--font-sans); white-space: nowrap; }

/* Capacity */
.pips { display: inline-flex; gap: 4px; }
.pip { width: 28px; height: 8px; border-radius: 999px; border: 1.5px solid var(--border-strong); }
.pip[data-on="true"] { background: var(--primary); border-color: var(--primary); }
.pip[data-off="true"] { border-style: dashed; opacity: .7; }

/* Severity bar */
.sevbar { display: flex; height: 12px; gap: 2px; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.f-critical { background: var(--sev-critical); } .f-high { background: var(--sev-high); } .f-medium { background: var(--sev-medium); } .f-low { background: var(--sev-low); } .f-info { background: var(--sev-info); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; font-weight: 500; font-size: 13px; color: var(--ink-muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.tab .tc { font-size: 12px; padding: 0 6px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); }

/* Key-value */
.kv { display: grid; grid-template-columns: minmax(96px, 38%) minmax(0, 1fr); gap: 8px 16px; font-size: 13px; line-height: 18px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Drawer & modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--surface-1); z-index: 61; display: flex; flex-direction: column; box-shadow: var(--shadow-overlay); border-left: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0px); }
.drawer-h { display: flex; gap: 12px; align-items: flex-start; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.drawer-b { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.drawer-f { padding: 12px 24px; border-top: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 8px; flex-wrap: wrap; }
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
.modal { position: relative; width: min(560px, 100%); background: var(--surface-1); border-radius: var(--r-lg); box-shadow: var(--shadow-overlay); border: 1px solid var(--border); }
.modal.wide { width: min(760px, 100%); }
.modal-b { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 20px; line-height: 28px; font-weight: 600; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); flex-wrap: wrap; }
.audit-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-muted); }

.evidence { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; font: 400 12px/18px var(--font-mono); white-space: pre-wrap; overflow-x: auto; margin: 0; }
.evidence mark { background: var(--warn-bg); color: var(--warn); border-radius: 2px; padding: 0 2px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.timeline li { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 18px; }
.timeline li:first-child { border-top: 0; }

.toast-zone { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--surface-1); padding: 10px 14px; border-radius: var(--r-md); font-size: 13px; box-shadow: var(--shadow-overlay); max-width: 380px; display: flex; gap: 8px; align-items: flex-start; }
.popover { position: absolute; right: 0; top: 44px; width: 380px; max-width: calc(100vw - 32px); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-overlay); z-index: 30; }
.popover .pi { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13px; line-height: 18px; cursor: pointer; }
.popover .pi:hover { background: var(--surface-2); }
.empty { padding: 40px 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--ink-muted); }
.empty strong { color: var(--ink); font-size: 15px; }

/* Annotations */
.pin { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--note); color: var(--surface-1); font: 600 11px/1 var(--font-sans); vertical-align: middle; flex: none; cursor: help; }
.notes { background: var(--surface-1); border-left: 1px solid var(--border); position: sticky; top: 39px; height: calc(100vh - 39px); overflow-y: auto; }
.notes-h { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.notes-h h2 { font-size: 14px; font-weight: 600; }
.notes ol { list-style: none; margin: 0; padding: 8px 0; }
.notes li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 10px 20px; font-size: 13px; line-height: 18px; }
.notes .ref { display: block; margin-top: 4px; font: 500 11px/16px var(--font-mono); color: var(--note); }
.tbd { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; height: 20px; border-radius: var(--r-sm); border: 1px dashed var(--note); color: var(--note); background: var(--note-bg); font: 500 11px/18px var(--font-sans); white-space: nowrap; cursor: help; }

/* Login */
.login { min-height: calc(100vh - 39px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-art { background: var(--primary); color: var(--on-primary); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login-art h1 { font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; max-width: 440px; }
.login-art p { max-width: 420px; opacity: .9; }
.login-form { display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
.login-box { width: min(380px, 100%); display: flex; flex-direction: column; gap: 18px; }
.otp { display: flex; gap: 8px; }
.otp input { width: 44px; height: 48px; text-align: center; font: 500 20px/1 var(--font-mono); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface-1); }

/* Sitemap */
.tree { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px solid var(--border); }
.tree li { padding: 4px 0 4px 12px; position: relative; font-size: 13px; line-height: 18px; }
.tree li::before { content: ""; position: absolute; left: -16px; top: 13px; width: 22px; height: 1px; background: var(--border); }
.slice { font: 500 11px/16px var(--font-sans); padding: 0 6px; border-radius: var(--r-sm); margin-left: 6px; }
.slice.s1 { background: var(--ok-bg); color: var(--ok); } .slice.s2 { background: var(--neutral-bg); color: var(--neutral); } .slice.s3 { background: var(--neutral-bg); color: var(--neutral); }

.report { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 40px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 860px; }
.report h1 { font-size: 26px; line-height: 32px; }
.report table.t td, .report table.t th { padding: 8px 10px; }
.watermark { border: 2px solid var(--warn); color: var(--warn); padding: 10px 14px; border-radius: var(--r-md); font-weight: 600; font-size: 13px; }

@media (max-width: 1100px) {
  .shell.notes-on { grid-template-columns: 232px minmax(0, 1fr); }
  .shell.notes-on .notes { position: fixed; right: 0; top: 39px; width: min(340px, 100%); z-index: 45; box-shadow: var(--shadow-overlay); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .profiles { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .proto { position: static; flex-wrap: wrap; height: auto; white-space: normal; }
  .shell, .shell.notes-on { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .side .navsec, .side-foot, .brand span { display: none; }
  .brand { padding: 8px 10px; width: 100%; }
  .nav { width: auto; }
  .topbar { position: static; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .page { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .grid-eq, .f2, .modlist { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv dd { margin-bottom: 8px; }
  .val li { grid-template-columns: 16px minmax(0, 1fr); } .val li > span:last-child { grid-column: 2; }
  .login { grid-template-columns: minmax(0, 1fr); } .login-art { padding: 32px 20px; }
  .who { display: none; }
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .report { padding: 24px 20px; }
}
